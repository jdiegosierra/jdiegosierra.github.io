name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tag must match the exact Playwright version pinned in package.json.
    # The image ships Chromium, its system libraries, and git, so no
    # "playwright install --with-deps" step is needed at CI time.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: "last updated" dates and sitemap lastmod come from git log.
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Check shared content is in sync with data/profile.json
        run: npm run content:check

      - name: Build site
        run: npm run build
        env:
          # Authenticated requests avoid GitHub API rate limits when fetching star counts.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
